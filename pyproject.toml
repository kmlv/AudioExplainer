[project]
name = "audioexplainer"
version = "0.1.3"
description = "Vendor-neutral audio-explainer layer: turn an AI-written script into a neural-voice MP3, callable from any agent CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kristian López Vargas" }]
keywords = ["audio", "tts", "codex", "claude", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "edge-tts>=7.2.8",
  "latex2mathml>=3.81.0",
]

[project.urls]
Homepage = "https://github.com/kmlv/AudioExplainer"
Repository = "https://github.com/kmlv/AudioExplainer"
Issues = "https://github.com/kmlv/AudioExplainer/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
piper = [
  "piper-tts>=1.6.0,<2",
  # onnxruntime 1.23.x is the last line that publishes CPython 3.10 wheels.
  "onnxruntime<1.24; python_version < '3.11'",
]

[project.scripts]
audioexplain = "audioexplainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audioexplainer"]

# Discovery snippet templates shipped with the package so an installer can copy
# them into each agent's global config location (with explicit user approval).
[tool.hatch.build.targets.wheel.force-include]
"share/templates" = "audioexplainer/_templates"

[tool.hatch.build.targets.sdist]
include = [
  "src/audioexplainer",
  "share/templates",
  "tests",
  ".github/workflows",
  "scripts",
  ".gitignore",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "pyproject.toml",
  "uv.lock",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
